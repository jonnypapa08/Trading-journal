
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal</title>
<style>
  :root{
    --bg:#0f1419;
    --panel:#161c24;
    --panel2:#1c232c;
    --border:#2a3340;
    --text:#e6edf3;
    --muted:#7d8894;
    --green:#3fb950;
    --green-dim:#1a3320;
    --red:#f85149;
    --red-dim:#3a1a1a;
    --amber:#d4a72c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'Consolas','SFMono-Regular',Menlo,monospace; }

  header{
    padding:24px 32px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    margin:0;
    font-size:20px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text);
    font-weight:700;
  }
  header .sub{
    color:var(--muted);
    font-size:12px;
    letter-spacing:0.05em;
    margin-top:4px;
  }

  .balance-setup{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }
  .balance-setup input{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--amber);
    font-family:'Consolas',monospace;
    padding:6px 10px;
    border-radius:4px;
    width:130px;
    font-size:14px;
  }
  .balance-setup button{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    font-size:12px;
  }
  .balance-setup button:hover{ border-color:var(--amber); }
  .balance-setup button:disabled{ opacity:0.5; cursor:default; }

  .stats-bar{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    margin:20px 32px 0;
  }
  .stat{
    background:var(--panel);
    padding:14px 18px;
  }
  .stat .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .stat .value{
    font-size:20px;
    font-weight:600;
    font-family:'Consolas',monospace;
  }
  .pos{ color:var(--green); }
  .neg{ color:var(--red); }
  .neu{ color:var(--text); }

  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
    margin:24px 0 8px;
  }
  .cal-nav button{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    width:34px;height:34px;
    border-radius:4px;
    cursor:pointer;
    font-size:16px;
  }
  .cal-nav button:hover{ border-color:var(--amber); color:var(--amber); }
  .cal-nav .month-label{
    font-size:16px;
    font-weight:700;
    letter-spacing:0.05em;
    min-width:200px;
    text-align:center;
  }

  .calendar{
    max-width:1100px;
    margin:0 auto 40px;
    padding:0 32px;
  }
  .dow-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .dow-row div{
    text-align:center;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--muted);
    text-transform:uppercase;
    padding-bottom:4px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cell{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    min-height:92px;
    padding:8px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:transform .08s ease, border-color .08s ease;
  }
  .cell:hover{ border-color:var(--amber); transform:translateY(-1px); }
  .cell.empty{ background:transparent; border:none; cursor:default; }
  .cell.empty:hover{ transform:none; }
  .cell.profit{ background:var(--green-dim); border-color:#2a5a34; }
  .cell.loss{ background:var(--red-dim); border-color:#5a2a2a; }
  .cell .daynum{
    font-size:12px;
    color:var(--muted);
  }
  .cell.profit .daynum, .cell.loss .daynum{ color:var(--text); }
  .cell .pnl{
    font-family:'Consolas',monospace;
    font-size:15px;
    font-weight:700;
  }
  .cell .meta-row{
    display:flex;
    align-items:baseline;
    gap:4px;
    font-family:'Consolas',monospace;
    font-size:10px;
    color:var(--muted);
  }
  .cell.today{ box-shadow:inset 0 0 0 2px var(--amber); }

  /* Modal */
  .overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:16px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    width:100%;
    max-width:820px;
    max-height:90vh;
    overflow-y:auto;
    padding:28px;
  }
  .modal h2{
    margin:0 0 4px;
    font-size:16px;
    letter-spacing:0.04em;
  }
  .modal .modal-sub{
    color:var(--muted);
    font-size:12px;
    margin-bottom:18px;
  }
  .trade-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
  }
  .trade-row input{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px;
    border-radius:4px;
    font-size:13px;
    width:100%;
  }
  .trade-row input.pnl-input{ font-family:'Consolas',monospace; }
  .trade-row button.remove{
    background:transparent;
    border:1px solid var(--border);
    color:var(--red);
    width:32px;height:32px;
    border-radius:4px;
    cursor:pointer;
  }
  .add-trade{
    background:var(--panel2);
    border:1px dashed var(--border);
    color:var(--muted);
    padding:8px;
    border-radius:4px;
    width:100%;
    cursor:pointer;
    font-size:13px;
    margin-top:4px;
  }
  .add-trade:hover{ color:var(--amber); border-color:var(--amber); }
  .notes-field{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    padding:8px 0 0;
    font-size:14px;
    line-height:1.6;
    margin-top:6px;
    resize:none;
    overflow:hidden;
    min-height:32px;
    font-family:inherit;
  }
  .image-section{
    margin-top:14px;
  }
  .image-section .image-label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .image-grid{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-top:10px;
  }
  .image-thumb{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--border);
    background:var(--panel2);
  }
  .image-thumb img{
    width:100%;
    height:auto;
    display:block;
    cursor:zoom-in;
    transition:opacity .1s ease;
  }
  .image-thumb img:hover{ opacity:0.92; }
  .image-thumb .thumb-remove{
    position:absolute;
    top:8px;
    right:8px;
    width:28px;
    height:28px;
    border-radius:4px;
    border:1px solid var(--border);
    background:rgba(15,20,25,0.85);
    color:var(--red);
    cursor:pointer;
    font-size:15px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .image-thumb .thumb-remove:hover{ border-color:var(--red); }

  .notes-section{
    margin-top:24px;
    padding-top:18px;
    border-top:1px solid var(--border);
  }

  .lightbox-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.88);
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:24px;
    cursor:zoom-out;
  }
  .lightbox-overlay.show{ display:flex; }
  .lightbox-overlay img{
    max-width:100%;
    max-height:100%;
    border-radius:6px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }

  .modal-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    gap:10px;
  }
  .day-total{
    font-family:'Consolas',monospace;
    font-size:15px;
    font-weight:700;
  }
  .modal-buttons{ display:flex; gap:8px; }
  .btn{
    padding:9px 16px;
    border-radius:4px;
    border:1px solid var(--border);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
  }
  .btn-save{ background:var(--amber); color:#1a1200; border-color:var(--amber); }
  .btn-save:disabled{ opacity:0.6; cursor:default; }
  .btn-cancel{ background:transparent; color:var(--muted); }
  .btn-cancel:hover{ color:var(--text); }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:20px;
    border-top:1px solid var(--border);
  }

  .loading-screen{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:60vh;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .save-flag{
    font-size:11px;
    color:var(--muted);
    margin-left:6px;
  }
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">Loading journal&hellip;</div>

<div id="app" style="display:none;">

<header>
  <div>
    <h1>Trading Journal</h1>
    <div class="sub">Daily P&amp;L &middot; running balance &middot; monthly performance</div>
  </div>
  <div class="balance-setup">
    Starting balance
    <input type="number" id="startingBalanceInput" class="mono" step="0.01">
    <button id="saveBalanceBtn">Set</button>
    <span class="save-flag" id="balanceSaveFlag"></span>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="cal-nav">
  <button id="prevBtn">&#8592;</button>
  <div class="month-label" id="monthLabel"></div>
  <button id="nextBtn">&#8594;</button>
</div>

<div class="calendar">
  <div class="dow-row">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="grid" id="calGrid"></div>
</div>

<footer>Data is saved to your account and persists across sessions.</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalDate">Date</h2>
    <div class="modal-sub">Add every trade you took this day.</div>
    <div id="tradesContainer"></div>
    <button class="add-trade" id="addTradeBtn">+ Add trade</button>

    <div class="image-section">
      <label class="image-label">Trade Screenshots</label>
      <input type="file" id="imageInput" accept="image/*" multiple style="display:none">
      <button type="button" class="add-trade" id="importImageBtn">+ Import picture(s)</button>
      <div class="image-grid" id="imageGrid"></div>
    </div>

    <div class="notes-section">
      <label class="image-label">Notes</label>
      <textarea class="notes-field" id="notesField" placeholder="Notes for the day (setup, mistakes, lessons)..."></textarea>
    </div>

    <div class="modal-footer">
      <div class="day-total mono" id="dayTotal">$0.00</div>
      <div class="modal-buttons">
        <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn btn-save" id="saveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <img id="lightboxImg" alt="Trade screenshot full view">
</div>

<script>
const DATA_KEY = 'tj_data_v1';
const BALANCE_KEY = 'tj_starting_balance_v1';

let data = {}; // { "YYYY-MM-DD": { trades:[{symbol,pnl}], notes:"" } }
let startingBalance = 0;
let viewYear, viewMonth; // viewMonth 0-11

const today = new Date();
viewYear = today.getFullYear();
viewMonth = today.getMonth();

async function loadData(){
  try{
    const res = await window.storage.get(DATA_KEY, false);
    return res && res.value ? JSON.parse(res.value) : {};
  } catch(e){
    return {};
  }
}
async function saveData(d){
  try{
    await window.storage.set(DATA_KEY, JSON.stringify(d), false);
  } catch(e){
    console.error('Failed to save trades', e);
  }
}
async function loadStartingBalance(){
  try{
    const res = await window.storage.get(BALANCE_KEY, false);
    return res && res.value !== undefined ? parseFloat(res.value) : 0;
  } catch(e){
    return 0;
  }
}
async function saveStartingBalance(v){
  try{
    await window.storage.set(BALANCE_KEY, String(v), false);
    return true;
  } catch(e){
    console.error('Failed to save starting balance', e);
    return false;
  }
}

const startingBalanceInput = document.getElementById('startingBalanceInput');
const saveBalanceBtn = document.getElementById('saveBalanceBtn');
const balanceSaveFlag = document.getElementById('balanceSaveFlag');

saveBalanceBtn.addEventListener('click', async () => {
  const v = parseFloat(startingBalanceInput.value);
  startingBalance = isNaN(v) ? 0 : v;
  saveBalanceBtn.disabled = true;
  balanceSaveFlag.textContent = 'saving…';
  const ok = await saveStartingBalance(startingBalance);
  balanceSaveFlag.textContent = ok ? 'saved' : 'save failed';
  saveBalanceBtn.disabled = false;
  setTimeout(() => { balanceSaveFlag.textContent = ''; }, 1500);
  render();
});

function fmtMoney(n){
  const sign = n < 0 ? '-' : (n > 0 ? '+' : '');
  return sign + '$' + Math.abs(n).toFixed(2);
}
function fmtMoneyPlain(n){
  return '$' + n.toFixed(2);
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

function dayTotalPnl(key){
  const rec = data[key];
  if(!rec || !rec.trades || rec.trades.length === 0) return null;
  return rec.trades.reduce((s,t)=> s + (parseFloat(t.pnl)||0), 0);
}

// compute cumulative balance for every date up to and including given date
function balanceThrough(y,m,d){
  const targetKey = dateKey(y,m,d);
  const keys = Object.keys(data).filter(k => data[k].trades && data[k].trades.length > 0).sort();
  let bal = startingBalance;
  for(const k of keys){
    if(k <= targetKey){
      bal += dayTotalPnl(k);
    } else break;
  }
  return bal;
}

// balance as of right before the given date (i.e. excluding that day's own trades)
function balanceBefore(y,m,d){
  const targetKey = dateKey(y,m,d);
  const keys = Object.keys(data).filter(k => data[k].trades && data[k].trades.length > 0).sort();
  let bal = startingBalance;
  for(const k of keys){
    if(k < targetKey){
      bal += dayTotalPnl(k);
    } else break;
  }
  return bal;
}

// day's % return relative to the balance going into that day
function dayReturnPct(y,m,d){
  const key = dateKey(y,m,d);
  const pnl = dayTotalPnl(key);
  if(pnl === null) return null;
  const prevBal = balanceBefore(y,m,d);
  if(prevBal === 0) return null;
  return (pnl / prevBal) * 100;
}

const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function render(){
  document.getElementById('monthLabel').textContent = `${monthNames[viewMonth]} ${viewYear}`;
  renderCalendar();
  renderStats();
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const e = document.createElement('div');
    e.className = 'cell empty';
    grid.appendChild(e);
  }

  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(viewYear, viewMonth, d);
    const pnl = dayTotalPnl(key);
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(pnl !== null){
      cell.className += pnl >= 0 ? ' profit' : ' loss';
    }
    const isToday = (viewYear === today.getFullYear() && viewMonth === today.getMonth() && d === today.getDate());
    if(isToday) cell.className += ' today';

    const dayNum = document.createElement('div');
    dayNum.className = 'daynum';
    dayNum.textContent = d;
    cell.appendChild(dayNum);

    if(pnl !== null){
      const pnlEl = document.createElement('div');
      pnlEl.className = 'pnl ' + (pnl >= 0 ? 'pos' : 'neg');
      pnlEl.textContent = fmtMoney(pnl);
      cell.appendChild(pnlEl);

      const metaRow = document.createElement('div');
      metaRow.className = 'meta-row';
      const rec = data[key];
      const tradeCount = rec.trades.length;
      const pctReturn = dayReturnPct(viewYear, viewMonth, d);
      const pctText = pctReturn === null ? '—' : (pctReturn >= 0 ? '+' : '') + pctReturn.toFixed(2) + '%';
      metaRow.innerHTML = `<span>${tradeCount}t</span><span>&bull;</span><span>${pctText}</span>`;
      cell.appendChild(metaRow);
    } else {
      const spacer = document.createElement('div');
      spacer.className = 'bal';
      spacer.textContent = 'no trades';
      cell.appendChild(spacer);
    }

    cell.addEventListener('click', () => openModal(viewYear, viewMonth, d));
    grid.appendChild(cell);
  }
}

function renderStats(){
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  let tradingDays = 0, winDays = 0, lossDays = 0, monthPnl = 0;

  for(let d=1; d<=daysInMonth; d++){
    const key = dateKey(viewYear, viewMonth, d);
    const pnl = dayTotalPnl(key);
    if(pnl !== null){
      tradingDays++;
      monthPnl += pnl;
      if(pnl >= 0) winDays++; else lossDays++;
    }
  }

  const winPct = tradingDays > 0 ? (winDays / tradingDays * 100) : 0;
  const lastTradingDay = (() => {
    for(let d=daysInMonth; d>=1; d--){
      const key = dateKey(viewYear, viewMonth, d);
      if(dayTotalPnl(key) !== null) return d;
    }
    return null;
  })();
  const currentBalance = lastTradingDay ? balanceThrough(viewYear, viewMonth, lastTradingDay) :
    (() => {
      // fall back to last known balance before this month
      const keys = Object.keys(data).filter(k => data[k].trades && data[k].trades.length > 0).sort();
      const monthStartKey = dateKey(viewYear, viewMonth, 1);
      let bal = startingBalance;
      for(const k of keys){ if(k < monthStartKey) bal += dayTotalPnl(k); }
      return bal;
    })();

  const bar = document.getElementById('statsBar');
  bar.innerHTML = '';
  const stats = [
    { label:'Current Balance', value: fmtMoneyPlain(currentBalance), cls:'neu' },
    { label:'Month P&L', value: fmtMoney(monthPnl), cls: monthPnl > 0 ? 'pos' : (monthPnl < 0 ? 'neg' : 'neu') },
    { label:'Trading Days', value: tradingDays, cls:'neu' },
    { label:'Win Days', value: winDays, cls:'pos' },
    { label:'Loss Days', value: lossDays, cls:'neg' },
    { label:'Win Rate', value: tradingDays > 0 ? winPct.toFixed(1)+'%' : '—', cls: winPct >= 50 ? 'pos' : 'neg' },
  ];
  stats.forEach(s => {
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `<div class="label">${s.label}</div><div class="value ${s.cls}">${s.value}</div>`;
    bar.appendChild(el);
  });
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewMonth--;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  render();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewMonth++;
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  render();
});

// Modal logic
let activeKey = null;
const overlay = document.getElementById('overlay');
const tradesContainer = document.getElementById('tradesContainer');
const notesField = document.getElementById('notesField');

function autoGrowNotes(){
  notesField.style.height = 'auto';
  notesField.style.height = notesField.scrollHeight + 'px';
}
notesField.addEventListener('input', autoGrowNotes);
const dayTotalEl = document.getElementById('dayTotal');
const saveBtn = document.getElementById('saveBtn');
const imageInput = document.getElementById('imageInput');
const importImageBtn = document.getElementById('importImageBtn');
const imageGrid = document.getElementById('imageGrid');
const lightboxOverlay = document.getElementById('lightboxOverlay');
const lightboxImg = document.getElementById('lightboxImg');
let currentImages = []; // array of base64 data URLs for the active day

function renderImageGrid(){
  imageGrid.innerHTML = '';
  currentImages.forEach((dataUrl, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'image-thumb';

    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = 'Trade screenshot';
    img.addEventListener('click', () => openLightbox(dataUrl));

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'thumb-remove';
    removeBtn.title = 'Remove image';
    removeBtn.textContent = '\u00d7';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentImages.splice(idx, 1);
      renderImageGrid();
    });

    thumb.appendChild(img);
    thumb.appendChild(removeBtn);
    imageGrid.appendChild(thumb);
  });
}

// Lightbox logic
function openLightbox(dataUrl){
  lightboxImg.src = dataUrl;
  lightboxOverlay.classList.add('show');
}
function closeLightbox(){
  lightboxOverlay.classList.remove('show');
  lightboxImg.src = '';
}
lightboxOverlay.addEventListener('click', closeLightbox);

function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const maxDim = 1600;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else{ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

importImageBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', async () => {
  const files = Array.from(imageInput.files || []);
  imageInput.value = '';
  if(!files.length) return;
  for(const file of files){
    try{
      const compressed = await compressImage(file);
      currentImages.push(compressed);
    } catch(e){
      console.error('Failed to process image', e);
      alert('Could not load "' + file.name + '". Skipping it.');
    }
  }
  renderImageGrid();
});

function openModal(y,m,d){
  activeKey = dateKey(y,m,d);
  const rec = data[activeKey] || { trades: [], notes: '' };
  document.getElementById('modalDate').textContent =
    new Date(y,m,d).toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  notesField.value = rec.notes || '';
  
  tradesContainer.innerHTML = '';
  if(rec.trades && rec.trades.length){
    rec.trades.forEach(t => addTradeRow(t.symbol, t.pnl));
  } else {
    addTradeRow('', '');
  }
  // support old records that stored a single "image" field
  if(rec.images && rec.images.length){
    currentImages = [...rec.images];
  } else if(rec.image){
    currentImages = [rec.image];
  } else {
    currentImages = [];
  }
  renderImageGrid();
  updateDayTotal();
  
  // 1. Show the modal first so the browser can calculate element bounds
  overlay.classList.add('show');
  
  // 2. Now calculate the notes auto-height correctly!
  autoGrowNotes();
}

function addTradeRow(symbol='', pnl=''){
  const row = document.createElement('div');
  row.className = 'trade-row';
  row.innerHTML = `
    <input type="text" class="symbol-input" placeholder="Symbol (e.g. ES, AAPL)" value="${symbol}">
    <input type="number" step="0.01" class="pnl-input" placeholder="P&L ($)" value="${pnl}">
    <button class="remove" title="Remove trade">&times;</button>
  `;
  row.querySelector('.remove').addEventListener('click', () => {
    row.remove();
    updateDayTotal();
  });
  row.querySelector('.pnl-input').addEventListener('input', updateDayTotal);
  tradesContainer.appendChild(row);
}

document.getElementById('addTradeBtn').addEventListener('click', () => addTradeRow());

function updateDayTotal(){
  let total = 0;
  tradesContainer.querySelectorAll('.trade-row').forEach(row => {
    const v = parseFloat(row.querySelector('.pnl-input').value);
    if(!isNaN(v)) total += v;
  });
  dayTotalEl.textContent = fmtMoney(total);
  dayTotalEl.className = 'day-total mono ' + (total > 0 ? 'pos' : (total < 0 ? 'neg' : 'neu'));
}

document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

function closeModal(){
  overlay.classList.remove('show');
  activeKey = null;
}

saveBtn.addEventListener('click', async () => {
  const trades = [];
  tradesContainer.querySelectorAll('.trade-row').forEach(row => {
    const symbol = row.querySelector('.symbol-input').value.trim();
    const pnlVal = row.querySelector('.pnl-input').value;
    if(symbol !== '' || pnlVal !== ''){
      trades.push({ symbol: symbol || 'Trade', pnl: parseFloat(pnlVal) || 0 });
    }
  });
  const notes = notesField.value.trim();

  if(trades.length === 0 && notes === '' && currentImages.length === 0){
    delete data[activeKey];
  } else {
    data[activeKey] = { trades, notes, images: currentImages.slice() };
  }

  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  await saveData(data);
  saveBtn.disabled = false;
  saveBtn.textContent = 'Save';

  closeModal();
  render();
});

async function init(){
  try{
    const [d, b] = await Promise.all([loadData(), loadStartingBalance()]);
    data = d;
    startingBalance = b;
  } catch(e){
    console.error('Failed to load journal data', e);
  }
  startingBalanceInput.value = startingBalance;
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
}

init();
</script>
